<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>AyrWeather · Live Ayrshire Weather</title>
<meta name="description" content="Interactive Ayrshire weather map: live conditions, forecasts, marine, rivers, storm replay, Prism intelligence." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ──────────────────────────────────────────────────────────
   AyrWeather · Map Edition 2026
   Full-screen Leaflet map with progressive disclosure.
   Dark-first, responsive, Windy.com-inspired.
   ────────────────────────────────────────────────────────── */

:root {
  --mood-1: #0b1220; --mood-2: #13203a; --mood-3: #1c2f55;
  --accent: #6ea8ff; --accent-soft: rgba(110,168,255,0.15);
  --bg: #07101e;
  --surface: rgba(255,255,255,0.04); --surface-2: rgba(255,255,255,0.07);
  --surface-hi: rgba(255,255,255,0.10);
  --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
  --text: #eaf1fb; --text-dim: rgba(234,241,251,0.68); --text-mute: rgba(234,241,251,0.45);
  --good: #32d296; --warn: #ffb545; --bad: #ff6b6b; --info: #6ea8ff; --storm: #b48bff;
  --r-xs: 8px; --r-sm: 12px; --r-md: 18px; --r-lg: 26px;
  --ease: cubic-bezier(.4,0,.2,1); --t-fast: 180ms; --t-med: 360ms;
  --glass: rgba(7,16,30,0.78); --glass-border: rgba(255,255,255,0.10);
}
html[data-theme="light"] {
  --bg: #f4f7fc;
  --surface: rgba(12,28,58,0.04); --surface-2: rgba(12,28,58,0.07);
  --surface-hi: rgba(12,28,58,0.10);
  --line: rgba(12,28,58,0.08); --line-2: rgba(12,28,58,0.16);
  --text: #0b1f3a; --text-dim: rgba(11,31,58,0.72); --text-mute: rgba(11,31,58,0.50);
  --glass: rgba(244,247,252,0.82); --glass-border: rgba(12,28,58,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; color: var(--text); letter-spacing: -0.005em;
}
a { color: var(--accent); text-decoration: none; }

/* ── Map ── */
#map { position: fixed; inset: 0; z-index: 0; }
.leaflet-control-zoom { display: none; }
.osm-dark { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.1) saturate(0.3); }

/* ── UI Overlay ── */
#ui-overlay { position: fixed; inset: 0; z-index: 500; pointer-events: none; }
#ui-overlay > * { pointer-events: auto; }

/* ── Top Bar ── */
#top-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 48px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; gap: 12px;
  background: var(--glass); border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 12px var(--accent); animation: pulse 2.4s var(--ease) infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:.6} }
.brand small { color: var(--text-mute); font-weight: 500; font-size: 11px; margin-left: 4px; }
.top-right { display: flex; align-items: center; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--text-dim); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all var(--t-fast) var(--ease); font-family: inherit;
}
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* ── Location Selector ── */
#loc-selector {
  position: absolute; left: 12px; top: 60px;
  display: flex; flex-direction: column; gap: 4px;
}
.loc-pill {
  font-family: inherit; font-size: 12px; font-weight: 500;
  padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass); color: var(--text-dim);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  cursor: pointer; transition: all var(--t-fast) var(--ease); white-space: nowrap;
  text-align: left;
}
.loc-pill:hover { color: var(--text); border-color: var(--line-2); }
.loc-pill.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

/* ── Summary Strip ── */
#summary-strip {
  position: absolute; bottom: 68px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 20px;
  padding: 12px 20px; border-radius: var(--r-lg);
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  cursor: pointer; transition: all var(--t-fast) var(--ease);
  overflow: hidden;
}
#summary-strip:hover { border-color: var(--line-2); }
.ss-city { font-size: 18px; font-weight: 700; min-width: 100px; }
.ss-temp { font-size: 28px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.ss-icon { font-size: 26px; }
.ss-stat { display: flex; flex-direction: column; gap: 1px; }
.ss-stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-mute); font-weight: 600; }
.ss-stat-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ss-outdoor {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); font-size: 12px; font-weight: 700;
}
.ss-prism { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-mute); }

/* ── Timeline Bar ── */
#timeline-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: var(--glass); border-top: 1px solid var(--glass-border);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.tl-mode {
  display: flex; border-radius: var(--r-xs); overflow: hidden;
  border: 1px solid var(--line); font-size: 11px;
}
.tl-mode button {
  font-family: inherit; padding: 5px 10px; border: none;
  background: var(--surface); color: var(--text-dim); cursor: pointer;
  font-weight: 500; font-size: 11px; transition: all var(--t-fast) var(--ease);
}
.tl-mode button.active { background: var(--accent); color: #fff; }
.tl-btn {
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  font-family: inherit; transition: all var(--t-fast) var(--ease);
}
.tl-btn:hover { background: var(--surface-2); }
.tl-slider { flex: 1; accent-color: var(--accent); }
.tl-time { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-dim); min-width: 80px; text-align: right; }
.tl-speed { font-size: 10px; color: var(--text-mute); cursor: pointer; padding: 3px 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); font-family: inherit; }

/* ── Layer Panel ── */
#layer-panel {
  position: absolute; top: 52px; right: 12px;
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md); padding: 12px 16px;
  display: none; min-width: 180px;
}
#layer-panel.open { display: block; }
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0; font-size: 13px; cursor: pointer;
}
.layer-row input { accent-color: var(--accent); }
.layer-row label { cursor: pointer; flex: 1; }

/* ── Warning Banner ── */
#warn-banner {
  position: absolute; top: 52px; left: 12px; right: 12px;
  display: none; z-index: 600;
}
#warn-banner.active { display: block; }
.warn-card {
  padding: 14px 18px; border-radius: var(--r-md);
  background: var(--glass); border: 1px solid rgba(255,107,107,0.4);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  cursor: pointer; transition: all var(--t-fast) var(--ease);
  animation: warnPulse 3s var(--ease) infinite;
}
.warn-card:hover { border-color: rgba(255,107,107,0.7); }
.warn-card.severe { border-color: rgba(255,60,60,0.6); background: rgba(255,40,40,0.15); }
.warn-card.amber { border-color: rgba(255,181,69,0.5); background: rgba(255,181,69,0.1); }
@keyframes warnPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,0)} 50%{box-shadow:0 0 20px 4px rgba(255,107,107,0.15)} }
.warn-header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.warn-sev { padding:3px 10px; border-radius:999px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; }
.warn-sev.red { background:rgba(255,60,60,0.3); color:#ff9999; }
.warn-sev.amber { background:rgba(255,181,69,0.3); color:#ffcf8a; }
.warn-sev.yellow { background:rgba(234,179,8,0.3); color:#fde68a; }
.warn-title { font-weight:700; font-size:14px; }
.warn-detail { font-size:12px; color:var(--text-dim); line-height:1.4; }
.warn-area { font-size:11px; color:var(--text-mute); margin-top:4px; }
.warn-count { font-size:11px; color:var(--text-mute); margin-top:6px; cursor:pointer; }
.data-source {
  display:flex; align-items:center; gap:6px;
  margin-top:16px; padding-top:12px; border-top:1px solid var(--line);
  font-size:10px; color:var(--text-mute); letter-spacing:0.02em;
}
.data-source::before { content:'📡'; font-size:12px; }

/* ── Drawer (detail panel) ── */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none; transition: opacity var(--t-med) var(--ease);
  z-index: 900; backdrop-filter: blur(4px);
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: min(460px, 100%);
  background: var(--bg); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform var(--t-med) var(--ease);
  z-index: 1000; overflow-y: auto; padding: 28px 28px 60px;
}
.drawer.open { transform: translateX(0); }
.drawer-close {
  position: sticky; top: 0; float: right;
  background: var(--surface); border: 1px solid var(--line);
  width: 32px; height: 32px; border-radius: 50%;
  color: var(--text); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}

/* ── Map Markers ── */
.town-marker {
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--r-md); padding: 8px 12px; text-align: center;
  cursor: pointer; transition: all var(--t-fast) var(--ease);
  white-space: nowrap; min-width: 64px;
}
.town-marker:hover { transform: scale(1.08); border-color: var(--accent); }
.town-marker.selected { border-color: var(--accent); box-shadow: 0 0 16px rgba(110,168,255,0.3); }
.tm-icon { font-size: 20px; line-height: 1; }
.tm-temp { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tm-name { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-mute); font-weight: 600; margin-top: 3px; }

.river-marker {
  background: var(--glass); border: 2px solid var(--good);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: var(--r-sm); padding: 4px 8px; text-align: center;
  cursor: pointer; font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: all var(--t-fast) var(--ease);
}
.river-marker:hover { transform: scale(1.1); }
.river-marker.rising { border-color: var(--warn); }
.river-marker.falling { border-color: var(--info); }
.rm-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-mute); font-weight: 600; }

.beach-marker {
  font-size: 16px; cursor: pointer; transition: transform var(--t-fast) var(--ease);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
.beach-marker:hover { transform: scale(1.3); }

.port-marker {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--glass);
  cursor: pointer; transition: all var(--t-fast) var(--ease);
}
.port-marker:hover { transform: scale(1.5); box-shadow: 0 0 8px var(--accent); }

/* ── Storm replay overlay ── */
.storm-ring { border: 3px solid var(--storm); border-radius: 50%; opacity: 0.6; }

/* ── Drawer content styles (migrated) ── */
.gauge { display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2); }
.gauge-label { font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-mute);font-weight:600; }
.gauge-value { font-size:22px;font-weight:600;font-variant-numeric:tabular-nums; }
.gauge-value small { font-size:12px;font-weight:400;color:var(--text-dim);margin-left:2px; }
.gauge-sub { font-size:11px;color:var(--text-mute); }
.sky-big { font-size:26px;font-weight:600;font-variant-numeric:tabular-nums; }
.sky-sub { font-size:12px;color:var(--text-dim);margin-top:2px; }
.prism-card {
  position:relative;padding:16px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);
  cursor:pointer;transition:all var(--t-fast) var(--ease);overflow:hidden;
}
.prism-card::before { content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent); }
.prism-card:hover { background:var(--surface-2);border-color:var(--line-2);transform:translateY(-1px); }
.prism-card.mood-warn::before { background:var(--warn); }
.prism-card.mood-bad::before { background:var(--bad); }
.prism-card.mood-good::before { background:var(--good); }
.prism-card.mood-storm::before { background:var(--storm); }
.prism-label { font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-mute);font-weight:600; }
.prism-value { font-size:20px;font-weight:700;margin-top:6px; }
.prism-sub { font-size:12px;color:var(--text-dim);margin-top:4px; }
.prism-meta { font-size:11px;color:var(--text-mute);margin-top:6px; }
.prism-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px; }

/* Hourly strip */
.hourly { display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent; }
.hourly::-webkit-scrollbar { height:5px; }
.hourly::-webkit-scrollbar-thumb { background:var(--line-2);border-radius:3px; }
.hour-cell { flex:0 0 auto;scroll-snap-align:start;width:64px;padding:10px 6px;border-radius:var(--r-md);background:var(--surface);border:1px solid transparent;text-align:center;transition:all var(--t-fast) var(--ease); }
.hour-cell.now { background:var(--accent-soft);border-color:var(--accent); }
.hour-time { font-size:10px;color:var(--text-mute);font-weight:600;text-transform:uppercase;letter-spacing:0.04em; }
.hour-icon { font-size:20px;margin:6px 0 2px; }
.hour-temp { font-size:16px;font-weight:600;font-variant-numeric:tabular-nums; }
.hour-precip { font-size:10px;color:var(--info);margin-top:4px;font-weight:600;height:14px; }

/* Daily rows */
.day-row { display:grid;grid-template-columns:86px 36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line); }
.day-row:last-child { border-bottom:none; }
.day-name { font-weight:600;font-size:13px; }
.day-name small { display:block;font-size:11px;color:var(--text-mute);font-weight:500;margin-top:1px; }
.day-icon { font-size:20px;text-align:center; }
.day-bar { position:relative;height:5px;background:linear-gradient(90deg,rgba(110,168,255,0.2),rgba(255,181,69,0.3));border-radius:3px; }
.day-bar::before,.day-bar::after { content:"";position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg); }
.day-bar::before { background:var(--info);left:var(--low,0%);transform:translateX(-50%); }
.day-bar::after { background:var(--warn);right:calc(100% - var(--high,100%));transform:translateX(50%); }
.day-temps { font-variant-numeric:tabular-nums;font-weight:600;display:flex;gap:8px;min-width:70px;justify-content:flex-end; }
.day-temps .hi { color:var(--text); }
.day-temps .lo { color:var(--text-mute); }

/* ── Tabs ── */
.tab-bar {
  display: flex; gap: 2px; margin-bottom: 16px;
  border-bottom: 1px solid var(--line); padding-bottom: 0;
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 8px 14px; border: none; background: none;
  color: var(--text-mute); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: all var(--t-fast) var(--ease); white-space: nowrap;
}
.tab-btn:hover { color: var(--text-dim); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── Charts ── */
.chart-wrap {
  position: relative; margin: 12px 0 20px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 12px 12px 4px; overflow: hidden;
}
.chart-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-mute); font-weight: 700; margin-bottom: 8px;
}
.chart-svg { width: 100%; height: 100px; display: block; }
.chart-svg.tall { height: 140px; }
.chart-legend {
  display: flex; gap: 14px; margin-top: 6px; padding-top: 6px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}
.chart-legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--text-mute);
}
.chart-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
.chart-axis-label { font-size: 9px; fill: var(--text-mute); }
.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.stat-row:last-child { border-bottom: none; }
.stat-label { color: var(--text-dim); }
.stat-val { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ── Zoom controls ── */
#zoom-controls {
  position: absolute; right: 12px; bottom: 140px;
  display: flex; flex-direction: column; gap: 4px;
}
#zoom-controls button {
  width: 36px; height: 36px; border-radius: var(--r-xs);
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--text); cursor: pointer; font-size: 18px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--t-fast) var(--ease); font-family: inherit;
}
#zoom-controls button:hover { background: var(--surface-2); }

/* ── Mobile ── */
@media (max-width: 860px) {
  #loc-selector { position: absolute; left: 0; right: 0; top: 48px; flex-direction: row;
    overflow-x: auto; padding: 6px 12px; gap: 4px; scrollbar-width: none;
    background: var(--glass); border-bottom: 1px solid var(--glass-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  #loc-selector::-webkit-scrollbar { display: none; }
  #summary-strip { bottom: 64px; left: 8px; right: 8px; gap: 12px; padding: 10px 14px; }
  .ss-stat:nth-child(n+5) { display: none; }
  .drawer { width: 100%; }
  #warn-banner { width: calc(100% - 24px); top: auto; top: 92px; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .ss-city { font-size: 15px; min-width: 70px; }
  .ss-temp { font-size: 22px; }
  .tm-name { display: none; }
  .ss-stat:nth-child(n+4) { display: none; }
}
@media print { #ui-overlay, .drawer-backdrop, .drawer { display: none; } }
</style>

<body>

<!-- ── Map ── -->
<div id="map"></div>

// WMO codes
const WMO_ICONS = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',56:'🌨️',57:'🌨️',61:'🌧️',63:'🌧️',65:'🌧️',66:'🌨️',67:'🌨️',71:'❄️',73:'❄️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WMO_DESC = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Heavy freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Heavy freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Violent showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm w/ hail',99:'Heavy thunderstorm w/ hail'};
const WIND_DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

// Helpers
const fmt = (v,d=1) => v!=null ? Number(v).toFixed(d) : '–';
const wmoIcon = c => WMO_ICONS[c] ?? '🌡️';
const wmoDesc = c => WMO_DESC[c] ?? 'Unknown';
const windDir = d => d==null ? '–' : WIND_DIRS[Math.round(d/22.5)%16];
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});
const fmtHour = iso => { const h=new Date(iso).getHours(); return h===0?'12a':h<12?`${h}a`:h===12?'12p':`${h-12}p`; };
const dayName = ds => ds===new Date().toISOString().split('T')[0] ? 'Today' : new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long'});
const dateFmt = ds => new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});

// Mood palette
const MOODS = {
  clear:{m1:'#0b1220',m2:'#1b3a6e',m3:'#2c5aa8',a:'#ffb545'},
  cloud:{m1:'#0b1220',m2:'#1f2d45',m3:'#334864',a:'#6ea8ff'},
  rain:{m1:'#081422',m2:'#173047',m3:'#204e6f',a:'#6ea8ff'},
  snow:{m1:'#0e1826',m2:'#2a3e5c',m3:'#4a6a96',a:'#d4e3ff'},
  fog:{m1:'#111a28',m2:'#2a3545',m3:'#475568',a:'#9bb4d4'},
  storm:{m1:'#0a0d1a',m2:'#2a1b48',m3:'#4a2b78',a:'#b48bff'},
};
function moodFor(code) {
  if(code==null) return MOODS.cloud;
  if([95,96,99].includes(code)) return MOODS.storm;
  if(code===0||code===1) return MOODS.clear;
  if([45,48].includes(code)) return MOODS.fog;
  if(code>=71&&code<=86&&code!==80&&code!==81&&code!==82) return MOODS.snow;
  if((code>=51&&code<=67)||(code>=80&&code<=82)) return MOODS.rain;
  return MOODS.cloud;
}
function applyMood(code) {
  const m=moodFor(code); const r=document.documentElement.style;
  r.setProperty('--mood-1',m.m1); r.setProperty('--mood-2',m.m2);
  r.setProperty('--mood-3',m.m3); r.setProperty('--accent',m.a);
  r.setProperty('--accent-soft',m.a+'26');
}

(isDark() ? darkTiles : lightTiles).addTo(map);

//  THEME
// ══════════════════════════════════════════════════════════
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('aw-theme', theme); } catch {}
  if (theme === 'dark') { map.removeLayer(lightTiles); darkTiles.addTo(map); }
  else { map.removeLayer(darkTiles); lightTiles.addTo(map); }
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  setTheme(isDark() ? 'light' : 'dark');
});
try { const s=localStorage.getItem('aw-theme'); if(s) setTheme(s); } catch {}

// ══════════════════════════════════════════════════════════
function renderLocSelector() {
  const el = document.getElementById('loc-selector');
  el.innerHTML = Object.entries(TOWNS).map(([k,v]) =>
    `<button class="loc-pill${k===currentLoc?' active':''}" data-loc="${k}">${v.name}</button>`
  ).join('');
  el.querySelectorAll('.loc-pill').forEach(b => b.addEventListener('click', () => {
    currentLoc = b.dataset.loc;
    el.querySelectorAll('.loc-pill').forEach(p => p.classList.toggle('active', p.dataset.loc===currentLoc));
    const t = TOWNS[currentLoc];
    map.flyTo([t.lat, t.lon], 12, {duration: 0.8});
    updateSummaryStrip();
    updateMarkerSelection();
  }));
}

// ══════════════════════════════════════════════════════════
//  LAYER PANEL
// ══════════════════════════════════════════════════════════
function renderLayerPanel() {
  const el = document.getElementById('layer-panel');
  el.innerHTML = Object.entries(layerGroups).map(([k,v]) =>
    `<div class="layer-row"><input type="checkbox" id="lyr-${k}" ${v.on?'checked':''}><label for="lyr-${k}">${v.label}</label></div>`
  ).join('');
  el.querySelectorAll('input').forEach(inp => inp.addEventListener('change', e => {
    const key = e.target.id.replace('lyr-','');
    const lg = layerGroups[key];
    lg.on = e.target.checked;
    if (lg.on) map.addLayer(lg.group); else map.removeLayer(lg.group);
  }));
}
document.getElementById('layer-toggle').addEventListener('click', () => {
  document.getElementById('layer-panel').classList.toggle('open');
});

  document.getElementById('drawer-backdrop').classList.add('open');
}
function closeDrawer() {

// ══════════════════════════════════════════════════════════
//  TOWN WEATHER MARKERS
// ══════════════════════════════════════════════════════════
const townMarkerMap = {}; // key -> L.marker

function createTownMarker(key, data) {
  const t = TOWNS[key];
  const cur = data?.forecast?.current ?? {};
  const code = cur.weather_code;
  const temp = cur.temperature_2m;
  const icon = L.divIcon({
    className: '',
    html: `<div class="town-marker${key===currentLoc?' selected':''}" data-key="${key}">
      <div class="tm-icon">${wmoIcon(code)}</div>
      <div class="tm-temp">${fmt(temp,0)}°</div>
      <div class="tm-name">${t.name}</div>
    </div>`,
    iconSize: [70, 66], iconAnchor: [35, 33],
  });
  const marker = L.marker([t.lat, t.lon], {icon}).on('click', () => {
    currentLoc = key;
    document.querySelectorAll('.loc-pill').forEach(p => p.classList.toggle('active', p.dataset.loc===key));
    updateSummaryStrip();
    updateMarkerSelection();
    openTownDetail(key);
  });
  townMarkerMap[key] = marker;
  return marker;
}

function updateMarkerSelection() {
  document.querySelectorAll('.town-marker').forEach(el => {
    el.classList.toggle('selected', el.dataset.key === currentLoc);
  });
}

async function loadAllTownWeather() {
  const results = await Promise.allSettled(
    Object.keys(TOWNS).map(key =>
      fetch(`/api/weather/${key}`).then(r=>r.json()).then(data=>({key,data}))
    )
  );
  layerGroups.weather.group.clearLayers();
  results.forEach(r => {
    if (r.status==='fulfilled') {
      const {key,data} = r.value;
      townData[key] = data;
      layerGroups.weather.group.addLayer(createTownMarker(key, data));
    }
  });
  // Apply mood from selected town
  const selData = townData[currentLoc];
  if (selData) applyMood(selData.forecast?.current?.weather_code);
  updateSummaryStrip();
}

// ══════════════════════════════════════════════════════════
//  SUMMARY STRIP
// ══════════════════════════════════════════════════════════
function updateSummaryStrip() {
  const data = townData[currentLoc];
  if (!data) return;
  const cur = data.forecast?.current ?? {};
  document.getElementById('ss-city').textContent = TOWNS[currentLoc].name;
  document.getElementById('ss-temp').textContent = `${fmt(cur.temperature_2m,0)}°`;
  document.getElementById('ss-icon').textContent = wmoIcon(cur.weather_code);
  document.getElementById('ss-feels').textContent = `${fmt(cur.apparent_temperature,0)}°`;
  document.getElementById('ss-wind').textContent = `${fmt(cur.wind_speed_10m,0)} ${windDir(cur.wind_direction_10m)}`;
  document.getElementById('ss-hum').textContent = `${fmt(cur.relative_humidity_2m,0)}%`;
  document.getElementById('ss-pres').textContent = `${fmt(cur.surface_pressure,0)}`;
  // Outdoor score + warning predictor
  const oc = window.__prism?.outdoor;
  const wp = window.__prism?.warnpred;
  let outdoorHtml = '';
  if (wp && wp.overall_probability > 10) {
    const wc = wp.overall_probability>=70?'var(--bad)':wp.overall_probability>=40?'var(--warn)':'var(--info)';
    outdoorHtml += `<span style="color:${wc};font-size:11px;font-weight:700;text-transform:uppercase">${wp.outlook}</span> `;
  }
  if (oc) {
    const color = oc.score>=70?'var(--good)':oc.score>=40?'var(--warn)':'var(--bad)';
    outdoorHtml += `<span style="color:${color};font-size:16px">${oc.score}</span> <span class="ss-prism">outdoor</span>`;
  }
  document.getElementById('ss-outdoor').innerHTML = outdoorHtml;
  document.getElementById('refresh-chip').textContent = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

document.getElementById('summary-strip').addEventListener('click', () => openTownDetail(currentLoc));

// ══════════════════════════════════════════════════════════
//  SVG CHART RENDERER
// ══════════════════════════════════════════════════════════
function svgChart(series, opts={}) {
  const W = opts.w || 380, H = opts.h || 100, pad = {t:8,r:8,b:18,l:32};
  const iW = W-pad.l-pad.r, iH = H-pad.t-pad.b;
  if (!series.length || !series[0].data.length) return '<div style="color:var(--text-mute);font-size:12px;padding:8px">No data</div>';

  // Calculate global Y range across all series
  let yMin=Infinity, yMax=-Infinity;
  series.forEach(s => s.data.forEach(v => { if(v!=null){yMin=Math.min(yMin,v);yMax=Math.max(yMax,v);} }));
  if (opts.yMin!=null) yMin=opts.yMin; if (opts.yMax!=null) yMax=opts.yMax;
  const yRange = yMax-yMin||1;
  const len = series[0].data.length;
  const xStep = iW/(len-1||1);
  const y = v => v!=null ? pad.t + iH - ((v-yMin)/yRange)*iH : null;
  const x = i => pad.l + i*xStep;

  // Y-axis labels
  const yTicks = [yMin, yMin+yRange/2, yMax];
  const yLabels = yTicks.map(v => `<text class="chart-axis-label" x="${pad.l-4}" y="${y(v)+3}" text-anchor="end">${opts.yFmt?opts.yFmt(v):v.toFixed(opts.yDec??0)}</text>`).join('');

  // X-axis labels
  const labels = opts.labels || [];
  const labelStep = Math.max(1, Math.floor(len/6));
  const xLabels = labels.length ? labels.filter((_,i) => i%labelStep===0).map((l,j) => `<text class="chart-axis-label" x="${x(j*labelStep)}" y="${H-2}" text-anchor="middle">${l}</text>`).join('') : '';

  // Grid lines
  const grid = yTicks.map(v => `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3,3"/>`).join('');

  // Threshold line
  let threshold = '';
  if (opts.threshold!=null) {
    const ty = y(opts.threshold);
    threshold = `<line x1="${pad.l}" x2="${W-pad.r}" y1="${ty}" y2="${ty}" stroke="${opts.thresholdColor||'var(--warn)'}" stroke-width="1" stroke-dasharray="5,3" opacity="0.6"/>`;
  }

  // Series lines + fills
  const paths = series.map(s => {
    const pts = s.data.map((v,i) => v!=null ? `${x(i)},${y(v)}` : null).filter(Boolean);
    if (!pts.length) return '';
    const line = `<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width||1.5}" stroke-linejoin="round" stroke-linecap="round" opacity="${s.opacity||1}"/>`;
    let fill = '';
    if (s.fill) {
      fill = `<polygon points="${x(0)},${y(yMin)} ${pts.join(' ')} ${x(len-1)},${y(yMin)}" fill="${s.color}" opacity="0.08"/>`;
    }
    return fill + line;
  }).join('');

  // Bar mode
  let bars = '';
  if (opts.bars) {
    const bw = Math.max(2, xStep*0.6);
    bars = series[0].data.map((v,i) => {
      if (v==null) return '';
      const h = ((v-yMin)/yRange)*iH;
      return `<rect x="${x(i)-bw/2}" y="${pad.t+iH-h}" width="${bw}" height="${h}" fill="${series[0].color}" opacity="0.5" rx="1"/>`;
    }).join('');
  }

  return `<svg class="chart-svg${opts.tall?' tall':''}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}${threshold}${opts.bars?bars:paths}${yLabels}${xLabels}
  </svg>`;
}

function chartLegend(items) {
  return `<div class="chart-legend">${items.map(i => `<div class="chart-legend-item"><div class="chart-legend-dot" style="background:${i.color}"></div>${i.label}</div>`).join('')}</div>`;
}

// ══════════════════════════════════════════════════════════
//  TOWN DETAIL DRAWER (TABBED)
// ══════════════════════════════════════════════════════════
function openTownDetail(key) {
  const data = townData[key];
  if (!data) return;
  const t = TOWNS[key];
  const cur = data.forecast?.current ?? {};
  const daily = data.forecast?.daily ?? {};
  const hourly = data.forecast?.hourly ?? {};
  const code = cur.weather_code;
  const p = window.__prism || {};
  const sunrise = daily?.sunrise?.[0];
  const sunset = daily?.sunset?.[0];

  // ── Tab: Overview ──
  const now = Date.now();
  const hourlyHtml = (hourly.time||[]).slice(0,24).map((time,i) => {
    const dt = new Date(time); const isNow = Math.abs(dt-now)<1800000;
    const precip = hourly.precipitation_probability?.[i]??0;

  const allTemps = [...(daily.temperature_2m_min||[]),...(daily.temperature_2m_max||[])].filter(v=>v!=null);

    <div class="hourly" style="margin-top:12px">${hourlyHtml||'<span style="color:var(--text-mute)">No data</span>'}</div>

  // ── Tab: Trends ──

  // ── Tab: Air Quality ──

      ${aq.dominant_pollutant?`<div style="padding:10px 12px;background:var(--surface);border-left:3px solid ${band.color||'var(--accent)'};border-radius:6px;font-size:12px;margin-bottom:16px">

        <div class="chart-title">River Levels (${snaps.length} snapshots, ~${Math.round((Date.now()-new Date(snaps[0].ts).getTime())/86400000)}d)</div>

      </div>
      <div class="chart-wrap">
        <div class="chart-title">Rainfall Intensity</div>
        ${svgChart([{data:precipHist,color:'#32d296',width:1.5}], {labels:histLabels, yMin:0, bars:true, yDec:1, yFmt:v=>v.toFixed(1)})}

        ${chartLegend([{color:'#b48bff',label:'hPa'},{color:'var(--text-mute)',label:'1013 normal'}])}

function renderRiverMarkers(rivers) {
  layerGroups.rivers.group.clearLayers();
  if (!rivers) return;
  Object.entries(RIVERS).forEach(([id, geo]) => {
    const r = rivers[id];
    if (!r) return;
    const level = r.current?.level_m;
    const trend = r.trend || 'stable';
    const arrow = trend==='rising'?'▲':trend==='falling'?'▼':'●';
    const cls = trend==='rising'?'rising':trend==='falling'?'falling':'';
    const icon = L.divIcon({
      className: '',
      html: `<div class="river-marker ${cls}">
        <div class="rm-label">${geo.name}</div>
        <div>${arrow} ${fmt(level,2)}m</div>
      </div>`,
      iconSize: [80, 36], iconAnchor: [40, 18],
    });
    L.marker([geo.lat, geo.lon], {icon}).on('click', () => {
      openDrawer(`<h2>${r.station||geo.name}</h2>
        <div class="sky-big">${fmt(level,2)}<small>m</small></div>
        <div class="sky-sub" style="text-transform:capitalize">${trend}</div>
        <div style="margin:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="gauge"><div class="gauge-label">24h Min</div><div class="gauge-value">${fmt(r.min_24h,2)}<small>m</small></div></div>
          <div class="gauge"><div class="gauge-label">24h Max</div><div class="gauge-value">${fmt(r.max_24h,2)}<small>m</small></div></div>
        </div>
        ${window.__prism?.floodrisk ? `<div style="padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:12px">
          <div style="font-size:11px;text-transform:uppercase;color:var(--text-mute);font-weight:600">Flood Risk</div>
          <div style="font-size:18px;font-weight:700;text-transform:capitalize;margin-top:4px">${window.__prism.floodrisk.risk_level} (${window.__prism.floodrisk.overall_risk}/10)</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:4px">6h precip: ${fmt(window.__prism.floodrisk.precip_forecast_6h_mm,1)}mm</div>
        </div>` : ''}
        <div class="data-source">SEPA river gauges (15-min readings) · Prism flood risk lens · Open-Meteo precipitation forecast</div>
      `);
    }).addTo(layerGroups.rivers.group);
  });
}

    color: '#6ea8ff', weight: 1, fillColor: '#6ea8ff', fillOpacity: 0.06,
    interactive: true, pane: 'marine',
  }).on('click', () => openMarineDetail()).addTo(layerGroups.marine.group);

  // Port markers
  Object.entries(PORTS).forEach(([k,p]) => {
    L.circleMarker([p.lat, p.lon], {
      radius: 5, color: '#6ea8ff', fillColor: '#6ea8ff', fillOpacity: 0.7, weight: 1,
    }).bindTooltip(p.name, {direction:'top',offset:[0,-8]})
      .on('click', () => openMarineDetail())
      .addTo(layerGroups.marine.group);
  });

function openMarineDetail() {
  const p = window.__prism;
  const mar = townData[currentLoc]?.marine?.current ?? {};
  let html = `<h2>Firth of Clyde</h2><div style="font-size:13px;color:var(--text-dim);margin-bottom:16px">Marine conditions & coastal intelligence</div>`;

  html += `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px">
    <div class="gauge"><div class="gauge-label">Wave Height</div><div class="gauge-value">${fmt(mar.wave_height)}<small>m</small></div></div>
    <div class="gauge"><div class="gauge-label">Period</div><div class="gauge-value">${fmt(mar.wave_period)}<small>s</small></div></div>
    <div class="gauge"><div class="gauge-label">Sea Temp</div><div class="gauge-value">${fmt(mar.sea_surface_temperature)}°C</div></div>
    <div class="gauge"><div class="gauge-label">Wind Wave</div><div class="gauge-value">${fmt(mar.wind_wave_height)}<small>m</small></div></div>
  </div>`;

  // Prism maritime cards
  const cards = [];
  if(p.risk) cards.push(`<div class="prism-card ${p.risk.risk_level==='high'||p.risk.risk_level==='extreme'?'mood-bad':p.risk.risk_level==='moderate'?'mood-warn':'mood-good'}"><div class="prism-label">Maritime Risk</div><div class="prism-value">${p.risk.score}/10 · ${p.risk.risk_level}</div><div class="prism-sub">${p.risk.recommendation||''}</div></div>`);
  if(p.beaufort) cards.push(`<div class="prism-card"><div class="prism-label">Beaufort</div><div class="prism-value">F${p.beaufort.beaufort_number} · ${p.beaufort.description}</div><div class="prism-sub">${p.beaufort.sea_state||''}</div></div>`);
  if(p.tide) cards.push(`<div class="prism-card"><div class="prism-label">Tide</div><div class="prism-value">${p.tide.arrow} ${p.tide.current_height_m!=null?p.tide.current_height_m+'m':'—'}</div><div class="prism-sub" style="text-transform:capitalize">${p.tide.phase}</div></div>`);
  if(p.sar) cards.push(`<div class="prism-card ${p.sar.difficulty>=7?'mood-bad':p.sar.difficulty>=4?'mood-warn':'mood-good'}"><div class="prism-label">SAR Difficulty</div><div class="prism-value">${p.sar.difficulty}/10</div><div class="prism-sub">${p.sar.assessment||''}</div></div>`);
  if(p.beach) {
    const d = p.beach;
    cards.push(`<div class="prism-card ${d.any_avoid?'mood-bad':'mood-good'}"><div class="prism-label">Beach Safety</div><div class="prism-value">${d.any_avoid?'⚠️ Caution':'✅ All Safe'}</div><div class="prism-sub">${d.beach_count} beaches · ${d.active_overflows_total} overflows</div></div>`);
  }
  if(p.coastal) {
    const d = p.coastal;
    cards.push(`<div class="prism-card"><div class="prism-label">Coastal Flood</div><div class="prism-value">Surge ${fmt(d.surge_estimate_cm,0)}cm</div><div class="prism-sub">${d.ports?.length||0} ports monitored</div></div>`);
  }
  // Water quality
  if(p.waterquality) {
    const wq = p.waterquality;
    cards.push(`<div class="prism-card ${wq.active_overflows>0?'mood-warn':'mood-good'}"><div class="prism-label">Water Quality</div><div class="prism-value">${wq.active_overflows||0} overflows</div><div class="prism-sub">Rain ${fmt(wq.rainfall_rate_mm_hr,1)}mm/h</div></div>`);
  }
  // Harbour access
  if(p.harbour) {
    const hbs = p.harbour.harbours || [];
    const closed = hbs.filter(h => !h.accessible);
    cards.push(`<div class="prism-card ${closed.length?'mood-warn':'mood-good'}"><div class="prism-label">Harbours</div><div class="prism-value">${closed.length ? closed.length+' restricted' : 'All accessible'}</div><div class="prism-sub">${hbs.length} ports checked</div></div>`);
  }
  // Fishing
  if(p.fishing) {
    const f = p.fishing;
    cards.push(`<div class="prism-card"><div class="prism-label">Fishing</div><div class="prism-value">Sea ${f.sea_score}/10 · River ${f.river_score}/10</div><div class="prism-sub">Conditions score</div></div>`);
  }
  if(cards.length) html += `<div class="prism-grid">${cards.join('')}</div>`;

  // Water quality detail
  if(p.waterquality) {
    const wq = p.waterquality;
    html += `<div style="margin-top:16px"><div class="gauge-label" style="margin-bottom:8px">Bathing Water Quality</div>`;
    (wq.beaches||[]).forEach(b => {
      html += `<div class="stat-row"><span class="stat-label">${b.name}</span><span class="stat-val" style="text-transform:capitalize;color:${b.risk==='low'?'var(--good)':b.risk==='medium'?'var(--warn)':'var(--bad)'}">${b.risk} risk</span></div>`;
    });
    html += `</div>`;
  }

  // Harbour access detail
  if(p.harbour) {
    html += `<div style="margin-top:16px"><div class="gauge-label" style="margin-bottom:8px">Harbour Access</div>`;
    (p.harbour.harbours||[]).forEach(h => {
      html += `<div class="stat-row"><span class="stat-label">${h.name} <span style="font-size:10px;color:var(--text-mute)">${h.shelter}</span></span><span class="stat-val" style="color:${h.accessible?'var(--good)':'var(--bad)'}">${h.accessible?'Open':h.reason||'Restricted'}</span></div>`;
    });
    html += `</div>`;
  }

  html += `<div class="data-source">Open-Meteo Marine API · SEPA Bathing Water · UKHO Tides · Prism derived intelligence · WaveNet buoy data</div>`;
  openDrawer(html);
}

let radarLayer=null, radarTimestamps=[], radarIdx=0, radarPlaying=true, radarInt=null;

async function initRadar() {
  try {
    const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const d = await r.json();
    radarTimestamps = [...(d.radar?.past||[]),...(d.radar?.nowcast||[])];
    document.getElementById('tl-slider').max = radarTimestamps.length-1;
    radarIdx = (d.radar?.past?.length||1)-1;
    showRadarFrame();
    if(radarPlaying) startRadarAnim();
  } catch(e) { document.getElementById('tl-time').textContent='Radar unavailable'; }
}
function showRadarFrame() {
  const f=radarTimestamps[radarIdx]; if(!f) return;
  if(radarLayer) map.removeLayer(radarLayer);
  radarLayer = L.tileLayer(`https://tilecache.rainviewer.com${f.path}/512/{z}/{x}/{y}/4/1_1.png`,{opacity:0.55,tileSize:512,zoomOffset:-1,maxNativeZoom:11,maxZoom:16,minNativeZoom:1});
  layerGroups.radar.group.clearLayers();
  layerGroups.radar.group.addLayer(radarLayer);
  document.getElementById('tl-time').textContent = new Date(f.time*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('tl-slider').value = radarIdx;
}
function startRadarAnim() {
  if(radarInt) clearInterval(radarInt);
  radarInt=setInterval(()=>{ radarIdx=(radarIdx+1)%radarTimestamps.length; showRadarFrame(); },700);
}
function toggleRadar() {
  radarPlaying=!radarPlaying;
  document.getElementById('tl-play').innerHTML = radarPlaying?'&#x23f8;':'&#x25b6;';
  if(radarPlaying) startRadarAnim(); else if(radarInt){clearInterval(radarInt);radarInt=null;}
}

//  STORM HISTORY
// ══════════════════════════════════════════════════════════
let stormMode = false;
let stormIdx = 0, stormPlaying = false, stormInt = null;
let stormSpeed = 1;
const stormRing = L.circle([55.4583,-4.6292], {radius:0, color:'#b48bff', weight:3, fillOpacity:0.08, interactive:false});

async function loadStormHistory() {
  try {
    const r = await fetch('/api/storm-history?days=14');
    const d = await r.json();
    stormSnapshots = d.snapshots || [];
    stormEpisodes = d.episodes || [];
    if(stormSnapshots.length) {
      document.getElementById('tl-slider').max = stormSnapshots.length-1;
      stormIdx = stormSnapshots.length-1;
      showStormFrame();
    }
  } catch(e) { console.warn('Storm history unavailable', e); }
}

function showStormFrame() {
  const snap = stormSnapshots[stormIdx]; if(!snap) return;
  document.getElementById('tl-time').textContent = new Date(snap.ts).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'});
  document.getElementById('tl-slider').value = stormIdx;

  // Storm intensity ring
  layerGroups.storm.group.clearLayers();
  if(snap.stormy) {
    const radius = Math.max(2000, (snap.gust_kph||0) * 80);
    stormRing.setLatLng([55.4583,-4.6292]);
    stormRing.setRadius(radius);
    stormRing.setStyle({color: snap.gust_kph>60?'#ff6b6b':'#b48bff'});
    layerGroups.storm.group.addLayer(stormRing);
  }

  // Update river markers with historical levels
  if(snap.rivers) {
    layerGroups.rivers.group.eachLayer(marker => {
      const el = marker.getElement?.()?.querySelector('.river-marker');
      if(!el) return;
      const id = Object.keys(RIVERS).find(k => RIVERS[k].name === el.querySelector('.rm-label')?.textContent);
      if(id && snap.rivers[id] != null) {
        el.querySelector('div:last-child').textContent = `● ${fmt(snap.rivers[id],2)}m`;
      }
    });
  }
}

function toggleStormPlay() {
  stormPlaying=!stormPlaying;
  document.getElementById('tl-play').innerHTML = stormPlaying?'&#x23f8;':'&#x25b6;';
  if(stormPlaying) {
    stormInt=setInterval(()=>{
      stormIdx=(stormIdx+1)%stormSnapshots.length;
      showStormFrame();
    }, 700/stormSpeed);
  } else if(stormInt){clearInterval(stormInt);stormInt=null;}
}

function switchTimelineMode(mode) {
  stormMode = (mode==='storm');
  document.getElementById('tl-radar-btn').classList.toggle('active', !stormMode);
  document.getElementById('tl-storm-btn').classList.toggle('active', stormMode);
  document.getElementById('tl-speed').style.display = stormMode?'block':'none';

  // Stop any playing
  if(radarInt){clearInterval(radarInt);radarInt=null;}
  if(stormInt){clearInterval(stormInt);stormInt=null;}
  radarPlaying=false; stormPlaying=false;
  document.getElementById('tl-play').innerHTML = '&#x25b6;';

  if(stormMode) {
    // Hide radar, show storm layer
    if(layerGroups.radar.on) map.removeLayer(layerGroups.radar.group);
    map.addLayer(layerGroups.storm.group);
    if(!stormSnapshots.length) loadStormHistory();
    else { document.getElementById('tl-slider').max=stormSnapshots.length-1; showStormFrame(); }
  } else {
    // Show radar, hide storm
    map.removeLayer(layerGroups.storm.group);
    if(layerGroups.radar.on) map.addLayer(layerGroups.radar.group);
    document.getElementById('tl-slider').max = radarTimestamps.length-1;
    showRadarFrame();
  }
}

// Timeline controls
document.getElementById('tl-play').addEventListener('click', () => stormMode?toggleStormPlay():toggleRadar());
document.getElementById('tl-slider').addEventListener('input', e => {
  const v=parseInt(e.target.value);
  if(stormMode){stormIdx=v;showStormFrame();}else{radarIdx=v;showRadarFrame();}
});
document.getElementById('tl-radar-btn').addEventListener('click', ()=>switchTimelineMode('radar'));
document.getElementById('tl-storm-btn').addEventListener('click', ()=>switchTimelineMode('storm'));
document.getElementById('tl-speed').addEventListener('click', () => {
  const speeds=[1,2,5,10];
  stormSpeed=speeds[(speeds.indexOf(stormSpeed)+1)%speeds.length];
  document.getElementById('tl-speed').textContent=stormSpeed+'x';
  if(stormPlaying){clearInterval(stormInt);stormInt=setInterval(()=>{stormIdx=(stormIdx+1)%stormSnapshots.length;showStormFrame();},700/stormSpeed);}
});

//  WARNINGS
// ══════════════════════════════════════════════════════════
let warningsData = [];
async function loadWarnings() {
  try {
    const [metRes, floodRes, sepaRes] = await Promise.allSettled([
      fetch('/api/warnings').then(r=>r.json()),
      fetch('/api/floods').then(r=>r.json()),
      fetch('/api/prism/flood-alert-crossref').then(r=>r.json()),
    ]);
    const metWarns = metRes.status==='fulfilled' ? (metRes.value?.data?.warnings ?? metRes.value?.warnings ?? []) : [];
    const floodWarns = floodRes.status==='fulfilled' ? (floodRes.value?.items ?? []).filter(f => f.area?.toLowerCase().includes('ayr') || f.area?.toLowerCase().includes('strath') || f.area?.toLowerCase().includes('clyde')) : [];
    warningsData = [...metWarns, ...floodWarns];
    const el = document.getElementById('warn-banner');

    if (!warningsData.length) { el.classList.remove('active'); layerGroups.alerts.group.clearLayers(); return; }

    el.classList.add('active');
    const worst = warningsData[0];
    const sev = worst.level || worst.severity || 'yellow';
    const sevCls = sev==='red'?'severe':sev==='amber'?'amber':'';

    el.innerHTML = `<div class="warn-card ${sevCls}" onclick="openWarningDetail()">
      <div class="warn-header">
        <span class="warn-sev ${sev}">${sev.toUpperCase()}</span>
        <span class="warn-title">${worst.headline || worst.title || worst.description || 'Weather Warning'}</span>
      </div>
      <div class="warn-detail">${worst.what_to_expect || worst.message?.substring(0,120)+'...' || ''}</div>
      <div class="warn-area">Area: ${worst.affected_areas?.join(', ') || worst.area || 'Strathclyde'}</div>
      ${warningsData.length>1 ? `<div class="warn-count">+ ${warningsData.length-1} more warning${warningsData.length>2?'s':''} — tap for details</div>` : ''}
    </div>`;

    // Add warning area overlay to map
    layerGroups.alerts.group.clearLayers();
    // Red/amber tinted polygon over Ayrshire for Met Office warnings
    if (metWarns.length) {
      const ayrBounds = [[55.75,-4.95],[55.75,-4.20],[55.20,-4.20],[55.20,-4.95]];
      const color = sev==='red'?'#ff3c3c':sev==='amber'?'#ffb545':'#eab308';
      L.polygon(ayrBounds, {
        color, weight:2, fillColor:color, fillOpacity:0.10,
        dashArray:'8,6', interactive:true,
      }).bindTooltip(`⚠ ${worst.headline||'Warning active'}`, {sticky:true, className:'warn-tooltip'})
        .on('click', () => openWarningDetail())
        .addTo(layerGroups.alerts.group);
    }
    // Flood warning markers
    floodWarns.forEach(fw => {
      // Place a pulsing circle at the Ayr center for flood warnings
      L.circleMarker([55.46, -4.63], {
        radius:8, color:'#ff6b6b', fillColor:'#ff6b6b', fillOpacity:0.6, weight:2,
        className:'flood-pulse',
      }).bindTooltip(fw.description||'Flood alert', {direction:'top'})
        .on('click', () => openWarningDetail())
        .addTo(layerGroups.alerts.group);
    });
  } catch(e) {}
}

window.openWarningDetail = function() {
  if (!warningsData.length) return;
  let html = `<h2>Active Warnings</h2><div style="font-size:12px;color:var(--text-dim);margin-bottom:16px">${warningsData.length} active warning${warningsData.length>1?'s':''}</div>`;
  warningsData.forEach(w => {
    const sev = w.level||w.severity||'yellow';
    html += `<div style="padding:14px;background:var(--surface);border:1px solid ${sev==='red'?'rgba(255,60,60,0.4)':sev==='amber'?'rgba(255,181,69,0.3)':'rgba(234,179,8,0.3)'};border-radius:var(--r-md);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="warn-sev ${sev}">${sev.toUpperCase()}</span>
        <strong style="font-size:14px">${w.headline||w.title||w.description||'Warning'}</strong>
      </div>
      ${w.what_to_expect?`<div style="font-size:13px;color:var(--text-dim);margin-bottom:8px">${w.what_to_expect}</div>`:''}
      ${w.message?`<div style="font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:8px">${w.message.substring(0,300)}${w.message.length>300?'...':''}</div>`:''}
      <div style="font-size:11px;color:var(--text-mute)">
        ${w.affected_areas?'Areas: '+w.affected_areas.join(', '):''}
        ${w.area?'Area: '+w.area:''}
        ${w.time_raised?' · Issued: '+new Date(w.time_raised).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}
      </div>
    </div>`;
  });
  html += `<div class="data-source">Met Office Weather Warnings · SEPA Flood Alerts · Updated every 5 minutes</div>`;
  openDrawer(html);
};

// ══════════════════════════════════════════════════════════
//  PRISM INTELLIGENCE
// ══════════════════════════════════════════════════════════
async function loadPrism() {
  try {
    const _f=p=>fetch(`${PRISM_BASE}${p}`).then(r=>r.ok?r.json():null).catch(()=>null);
    const _l=p=>fetch(`${PRISM_LOCAL}${p}`).then(r=>r.ok?r.json():null).catch(()=>null);
    const [beaufort,risk,pressure,fog,sar,waves,storm,airquality,rain,aurora,tide,
           frontal,lightning,consensus,floodrisk,coastal,beach,darksky,outdoor,
           waterquality,harbour,fishing,warnpred] = await Promise.all([
      _f(`/beaufort/${currentLoc}`), _f(`/maritime-risk/${currentLoc}`),
      _f(`/pressure-tendency/${currentLoc}`), _f(`/dew-point/${currentLoc}`),
      _f(`/sar-difficulty/${currentLoc}`), _f(`/wave-analysis`),
      _f(`/storm-forecast/${currentLoc}`), _f(`/air-quality/${currentLoc}`),
      _f(`/rain-nowcast/${currentLoc}`), _f(`/aurora-viewing/${currentLoc}`),
      _f(`/tidal-state`),
      _l(`/frontal-boundary`), _l(`/lightning-risk/${currentLoc}`),
      _l(`/forecast-consensus`), _l(`/flood-risk`), _l(`/coastal-flood-risk`),
      _l(`/beach-safety`), _l(`/dark-sky/${currentLoc}`), _l(`/outdoor-score/${currentLoc}`),
      _l(`/water-quality`), _l(`/harbour-access`), _l(`/fishing/${currentLoc}`),
      _l(`/warning-predictor/${currentLoc}`),
    ]);
    window.__prism = {
      beaufort:beaufort?.data, risk:risk?.data, pressure:pressure?.data,
      fog:fog?.data, sar:sar?.data, waves:waves?.data, storm:storm?.data,
      airquality:airquality?.data, rain:rain?.data, aurora:aurora?.data, tide:tide?.data,
      frontal:frontal?.data, lightning:lightning?.data, consensus:consensus?.data,
      floodrisk:floodrisk?.data, coastal:coastal?.data, beach:beach?.data,
      darksky:darksky?.data, outdoor:outdoor?.data,
      waterquality:waterquality?.data, harbour:harbour?.data, fishing:fishing?.data,
      warnpred:warnpred?.data,
    };
    updateSummaryStrip();
  } catch(e) {}
}

// ══════════════════════════════════════════════════════════
//  RIVERS
// ══════════════════════════════════════════════════════════
async function loadRivers() {
  try {
    const res = await fetch('/api/rivers');
    const data = await res.json();
    renderRiverMarkers(data?.rivers);
  } catch(e) {}
}

// ══════════════════════════════════════════════════════════
//  MASTER LOADER
// ══════════════════════════════════════════════════════════
async function loadAll() {
  await Promise.all([loadAllTownWeather(), loadWarnings(), loadRivers(), loadPrism()]);
  renderMarineLayer();
}

// Expose for debugging / simulation
window._aw = { map, layerGroups, openDrawer, openTownDetail, openMarineDetail, TOWNS, RIVERS, townData };
renderLocSelector();
renderLayerPanel();
loadAll();
initRadar();
setInterval(loadAll, 5*60*1000);
</script>
